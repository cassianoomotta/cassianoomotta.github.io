<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="26" y1="20" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Fundo escuro premium com bordas arredondadas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(255, 255, 255, 0.1)" />

  <!-- Círculos de Radar / Ondas de Alerta Geográfico -->
  <circle cx="32" cy="30" r="20" stroke="#00F2FE" stroke-width="1" stroke-dasharray="2 3" opacity="0.25" />
  <circle cx="32" cy="30" r="14" stroke="#00F2FE" stroke-width="1.2" opacity="0.35" />

  <!-- Escudo Tático de Proteção / Defesa Civil -->
  <path d="M32 12 L46 18 V31 C46 41 39 49 32 52 C25 49 18 41 18 31 V18 L32 12 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.18" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Pin de Geolocalização Central com Ponto de Alerta -->
  <path d="M32 20 C27.58 20 24 23.58 24 28 C24 33.5 32 41 32 41 C32 41 40 33.5 40 28 C40 23.58 36.42 20 32 20 Z" 
        fill="url(#shieldGrad)" />
  <circle cx="32" cy="28" r="3.2" fill="#0F172A" />

  <!-- Pulso Ativo de Sinal / Alerta em Tempo Real -->
  <circle cx="45" cy="18" r="3.5" fill="#EF4444" />
  <circle cx="45" cy="18" r="6" stroke="#EF4444" stroke-width="1" opacity="0.6" />
</svg>
